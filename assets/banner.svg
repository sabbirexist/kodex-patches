<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Kodex Patches — Morphe patch bundles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="0.55" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#accent)"/>
  <rect x="0" y="234" width="1000" height="6" rx="3" fill="url(#glow)"/>

  <g opacity="0.16" fill="none" stroke="url(#accent)" stroke-width="3">
    <polygon points="905,52 962,84 962,148 905,180 848,148 848,84"/>
    <polygon points="775,34 832,66 832,130 775,162 718,130 718,66"/>
    <polygon points="905,52 962,84 962,148 905,180 848,148 848,84" transform="translate(0,40)" opacity="0.5"/>
  </g>

  <text x="64" y="118" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="76" font-weight="800" fill="#ffffff" letter-spacing="1">KODEX</text>
  <text x="66" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="12">PATCHES</text>
  <text x="68" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
